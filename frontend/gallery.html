<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gallery — Aroma FoodLand</title>
  <meta name="description"
    content="Take a look inside Aroma FoodLand — our dining room, food, events and hotel rooms in Sapele, Delta State." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
</head>

<body>
  <div id="app-header"></div>
  <main id="main">
    <section class="section">
      <div class="container">
        <div class="section-head">
          <h1>Gallery</h1>
          <p class="lede">A look inside Aroma FoodLand.</p>
        </div>
        <div class="category-scroller" id="gallery-filters">
          <button class="category-chip" aria-pressed="true" data-cat="">All</button>
          <button class="category-chip" data-cat="interior">Interior</button>
          <button class="category-chip" data-cat="exterior">Exterior</button>
          <button class="category-chip" data-cat="food">Food</button>
          <button class="category-chip" data-cat="events">Events</button>
          <button class="category-chip" data-cat="hotel">Hotel</button>
        </div>
        <div class="gallery-grid" id="gallery-grid" style="margin-top:var(--space-5);"></div>
      </div>
    </section>
  </main>
  <div id="app-footer"></div>

  <script src="js/config.js"></script>
  <script src="js/brand.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/render.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/pages/gallery.js"></script>
</body>

</html>
