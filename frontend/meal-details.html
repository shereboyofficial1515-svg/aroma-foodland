<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="page-title">Meal Details — Aroma FoodLand</title>
  <meta id="page-desc" name="description" content="View meal details, ingredients, allergens and reviews at Aroma FoodLand, Sapele." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
</head>
<body>
  <a href="#main" class="visually-hidden">Skip to content</a>
  <div id="app-header"></div>

  <main id="main">
    <section class="section">
      <div class="container">
        <a href="menu.html" class="btn btn-ghost btn-sm" style="margin-bottom:var(--space-4);">&larr; Back to menu</a>
        <div id="meal-content">
          <div class="grid grid-2">
            <div class="skeleton" style="aspect-ratio:4/3;border-radius:var(--radius-lg);"></div>
            <div>
              <div class="skeleton" style="height:32px;width:70%;margin-bottom:12px;"></div>
              <div class="skeleton" style="height:16px;width:100%;margin-bottom:8px;"></div>
              <div class="skeleton" style="height:16px;width:90%;"></div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section class="section" style="padding-top:0;">
      <div class="container">
        <h2>You might also like</h2>
        <div class="grid grid-4" id="related-meals" style="margin-top:var(--space-5);"></div>
      </div>
    </section>
  </main>

  <div id="app-footer"></div>

  <script src="js/config.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/render.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/pages/meal-details.js"></script>
</body>
</html>
