<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offers — Aroma FoodLand</title>
  <meta name="description" content="Current offers and promotions at Aroma FoodLand, Sapele." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
</head>
<body>
  <div id="app-header"></div>
  <main id="main">
    <section class="section">
      <div class="container">
        <div class="section-head"><h1>Offers</h1><p class="lede">Current promotions and special offers.</p></div>
        <div class="grid grid-3" id="offers-grid"></div>
      </div>
    </section>
  </main>
  <div id="app-footer"></div>

  <script src="js/config.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/render.js"></script>
  <script src="js/layout.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const gridEl = document.getElementById('offers-grid');
      gridEl.innerHTML = `<div class="skeleton" style="height:120px;"></div>`.repeat(3);
      try {
        const { promotions } = await window.AromaApi.get('/promotions');
        gridEl.innerHTML = promotions.length
          ? promotions.map((p) => `<div class="feature-tile"><div class="icon-wrap"><i data-icon="party"></i></div><div><h4>${p.title}</h4><p>${p.message}</p></div></div>`).join('')
          : window.AromaUI.emptyState({ icon: 'party', title: 'No offers right now', message: 'Check back soon for new promotions.' });
        AromaIcons.hydrateIcons(gridEl);
      } catch (err) {
        gridEl.innerHTML = window.AromaUI.emptyState({ icon: 'alertCircle', title: 'Could not load offers', message: window.AromaUI.friendlyError(err) });
      }
    });
  </script>
</body>
</html>
