<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hotel — Aroma FoodLand</title>
  <meta name="description" content="Book a comfortable hotel room at Aroma FoodLand, Sapele, Delta State." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
</head>
<body>
  <div id="app-header"></div>
  <main id="main">
    <section class="section">
      <div class="container" style="max-width:640px;">
        <div class="section-head text-center" style="margin:0 auto var(--space-6);">
          <h1>Hotel Stays</h1>
          <p class="lede" style="margin:8px auto;">Comfortable rooms for guests visiting Sapele — right above the restaurant.</p>
        </div>

        <form id="hotel-form" novalidate>
          <div class="grid grid-2">
            <div class="field">
              <label for="check_in">Check-in</label>
              <input type="date" id="check_in" required />
            </div>
            <div class="field">
              <label for="check_out">Check-out</label>
              <input type="date" id="check_out" required />
            </div>
          </div>
          <div class="grid grid-2">
            <div class="field">
              <label for="guests">Number of guests</label>
              <input type="number" id="guests" min="1" value="1" required />
            </div>
            <div class="field">
              <label for="room_type">Room type (optional)</label>
              <select id="room_type">
                <option value="">Any</option>
                <option value="standard">Standard</option>
                <option value="deluxe">Deluxe</option>
                <option value="suite">Suite</option>
              </select>
            </div>
          </div>
          <div class="field">
            <label for="additional_info">Additional information (optional)</label>
            <textarea id="additional_info" maxlength="1000"></textarea>
          </div>

          <hr class="rule" />
          <div class="field">
            <label for="customer_name">Full name</label>
            <input type="text" id="customer_name" required />
          </div>
          <div class="grid grid-2">
            <div class="field">
              <label for="customer_phone">Phone number</label>
              <input type="tel" id="customer_phone" required />
            </div>
            <div class="field">
              <label for="customer_email">Email</label>
              <input type="email" id="customer_email" required />
            </div>
          </div>

          <button type="submit" class="btn btn-primary btn-block btn-lg" id="hotel-submit">Request Booking</button>
        </form>
      </div>
    </section>
  </main>
  <div id="app-footer"></div>

  <script src="js/config.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/render.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/pages/hotel.js"></script>
</body>
</html>
