<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Menu — Aroma FoodLand</title>
  <meta name="description" content="Browse the full Aroma FoodLand menu — rice dishes, soups, swallow, chicken, turkey, beef, fish, burgers, drinks and more. Order online for pickup or delivery in Sapele." />
  <link rel="canonical" href="https://aromafoodland.com/menu.html" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
</head>
<body>
  <a href="#main" class="visually-hidden">Skip to content</a>
  <div id="app-header"></div>

  <main id="main">
    <section class="section" style="padding-bottom: 0;">
      <div class="container">
        <div class="section-head">
          <h1>Our Menu</h1>
          <p class="lede">Fresh Nigerian and intercontinental dishes, made to order.</p>
        </div>

        <div class="flex gap-3" style="flex-wrap:wrap; margin-bottom:var(--space-4);">
          <div class="input-group" style="max-width:320px;">
            <span class="prefix"><i data-icon="search" data-size="18"></i></span>
            <input type="search" id="menu-search" placeholder="Search meals…" aria-label="Search meals" />
          </div>
          <select id="menu-sort" aria-label="Sort by">
            <option value="newest">Newest</option>
            <option value="popular">Most popular</option>
            <option value="rating">Top rated</option>
            <option value="price_asc">Price: low to high</option>
            <option value="price_desc">Price: high to low</option>
          </select>
          <select id="menu-max-price" aria-label="Max price">
            <option value="">Any price</option>
            <option value="2000">Under ₦2,000</option>
            <option value="5000">Under ₦5,000</option>
            <option value="10000">Under ₦10,000</option>
          </select>
        </div>

        <div class="category-scroller" id="menu-categories"></div>
      </div>
    </section>

    <section class="section" style="padding-top:var(--space-5);">
      <div class="container">
        <div id="menu-results-info" class="text-muted" style="margin-bottom:var(--space-3); font-size:var(--fs-sm);"></div>
        <div class="grid grid-4" id="menu-grid" aria-live="polite"></div>
        <div class="flex-center gap-3" id="menu-pagination" style="margin-top:var(--space-8);"></div>
      </div>
    </section>
  </main>

  <div id="app-footer"></div>

  <script src="js/config.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/render.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/pages/menu.js"></script>
</body>
</html>
