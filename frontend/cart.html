<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Cart — Aroma FoodLand</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
</head>
<body>
  <a href="#main" class="visually-hidden">Skip to content</a>
  <div id="app-header"></div>

  <main id="main">
    <section class="section">
      <div class="container">
        <h1>Your Cart</h1>
        <div class="cart-layout" id="cart-layout">
          <div id="cart-items"></div>
          <aside class="cart-summary">
            <h3>Order Summary</h3>
            <div class="flex-between" style="margin-top:var(--space-4); font-size:var(--fs-sm);"><span class="text-muted">Subtotal</span><strong id="cart-subtotal">₦0</strong></div>
            <p class="text-muted" style="font-size:var(--fs-xs); margin-top:var(--space-2);">Delivery fee (if applicable) is calculated at checkout.</p>
            <hr class="rule" />
            <a href="checkout.html" class="btn btn-primary btn-block btn-lg" id="checkout-btn">Proceed to Checkout</a>
            <a href="menu.html" class="btn btn-ghost btn-block" style="margin-top:var(--space-2);">Continue browsing</a>
          </aside>
        </div>
      </div>
    </section>
  </main>

  <div id="app-footer"></div>

  <script src="js/config.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/render.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/pages/cart-page.js"></script>
</body>
</html>
