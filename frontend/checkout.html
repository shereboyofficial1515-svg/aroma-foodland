<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkout — Aroma FoodLand</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
</head>
<body>
  <a href="#main" class="visually-hidden">Skip to content</a>
  <div id="app-header"></div>

  <main id="main">
    <section class="section">
      <div class="container">
        <h1>Checkout</h1>
        <div class="cart-layout">
          <form id="checkout-form" novalidate>
            <h3>Order type</h3>
            <div class="flex gap-3" style="margin:var(--space-3) 0 var(--space-5);" role="radiogroup" aria-label="Order type">
              <label class="category-chip" style="cursor:pointer;"><input type="radio" name="order_type" value="delivery" checked style="margin-right:6px;" />Delivery</label>
              <label class="category-chip" style="cursor:pointer;"><input type="radio" name="order_type" value="pickup" style="margin-right:6px;" />Pickup</label>
              <label class="category-chip" style="cursor:pointer;"><input type="radio" name="order_type" value="dine_in" style="margin-right:6px;" />Dine-in</label>
            </div>

            <div class="field">
              <label for="customer_name">Full name</label>
              <input type="text" id="customer_name" required />
              <span class="error-text">Please enter your name.</span>
            </div>
            <div class="grid grid-2">
              <div class="field">
                <label for="customer_phone">Phone number</label>
                <input type="tel" id="customer_phone" required />
                <span class="error-text">Please enter a valid phone number.</span>
              </div>
              <div class="field">
                <label for="customer_email">Email</label>
                <input type="email" id="customer_email" required />
                <span class="error-text">Please enter a valid email.</span>
              </div>
            </div>

            <div class="field" id="address-field">
              <label for="delivery_address_text">Delivery address</label>
              <textarea id="delivery_address_text" placeholder="Street, area, landmark…"></textarea>
              <span class="error-text">A delivery address is required.</span>
            </div>

            <div class="field">
              <label for="special_instructions">Special instructions (optional)</label>
              <textarea id="special_instructions" maxlength="500"></textarea>
            </div>

            <button type="submit" class="btn btn-primary btn-lg btn-block" id="submit-order-btn">Continue to Payment</button>
          </form>

          <aside class="cart-summary">
            <h3>Order Summary</h3>
            <div id="checkout-items" style="margin:var(--space-4) 0; font-size:var(--fs-sm);"></div>
            <hr class="rule" />
            <div class="flex-between" style="font-size:var(--fs-sm);"><span class="text-muted">Subtotal</span><span id="checkout-subtotal">₦0</span></div>
            <div class="flex-between" style="font-size:var(--fs-sm); margin-top:4px;"><span class="text-muted">Delivery fee</span><span id="checkout-delivery">₦0</span></div>
            <hr class="rule" />
            <div class="flex-between"><strong>Total</strong><strong id="checkout-total">₦0</strong></div>
          </aside>
        </div>
      </div>
    </section>
  </main>

  <div id="app-footer"></div>

  <script src="js/config.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/render.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/pages/checkout.js"></script>
</body>
</html>
