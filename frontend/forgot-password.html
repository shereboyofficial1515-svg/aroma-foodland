<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password — Aroma FoodLand</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <style>.auth-shell { max-width: 420px; margin: var(--space-10) auto; }</style>
</head>
<body>
  <div id="app-header"></div>
  <main id="main">
    <section class="section">
      <div class="container auth-shell">
        <h1 class="text-center">Reset your password</h1>
        <p class="text-center lede" style="margin:8px auto var(--space-6);">Enter your email and we'll send you a reset link.</p>
        <form id="forgot-form" novalidate>
          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" required />
            <span class="error-text">Enter a valid email address.</span>
          </div>
          <button type="submit" class="btn btn-primary btn-block btn-lg" id="forgot-submit">Send Reset Link</button>
        </form>
        <p class="text-center" style="margin-top:var(--space-6); font-size:var(--fs-sm);">
          <a href="login.html" style="color:var(--primary-color); font-weight:600;">Back to sign in</a>
        </p>
      </div>
    </section>
  </main>
  <div id="app-footer"></div>

  <script src="js/config.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/render.js"></script>
  <script src="js/layout.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('forgot-form');
      const btn = document.getElementById('forgot-submit');
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value.trim();
        const run = window.AromaUI.withButtonLoading(btn, async () => {
          try {
            await window.AromaApi.post('/auth/forgot-password', { email });
            document.querySelector('.auth-shell').innerHTML = `<div class="text-center"><h1>Check your email</h1><p class="lede" style="margin:12px auto;">If an account exists for that email, we've sent a password reset link.</p><a href="login.html" class="btn btn-primary" style="margin-top:16px;">Back to sign in</a></div>`;
          } catch (err) {
            window.AromaUI.toast(window.AromaUI.friendlyError(err), 'error');
          }
        });
        run();
      });
    });
  </script>
</body>
</html>
