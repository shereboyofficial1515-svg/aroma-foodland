<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reserve a Table — Aroma FoodLand</title>
  <meta name="description"
    content="Reserve a table at Aroma FoodLand, Sapele. Choose a date, time and party size — we'll confirm by email." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
</head>

<body>
  <div id="app-header"></div>
  <main id="main">
    <section class="section">
      <div class="container" style="max-width:640px;">
        <div class="section-head text-center" style="margin:0 auto var(--space-6);">
          <h1>Reserve a Table</h1>
          <p class="lede" style="margin:8px auto;">Pick a date and time — we'll confirm your reservation shortly after.
          </p>
        </div>

        <form id="reservation-form" novalidate>
          <div class="grid grid-2">
            <div class="field">
              <label for="reservation_date">Date</label>
              <input type="date" id="reservation_date" required />
              <span class="error-text">Choose a valid date.</span>
            </div>
            <div class="field">
              <label for="guests">Number of guests</label>
              <input type="number" id="guests" min="1" max="50" value="2" required />
            </div>
          </div>

          <div class="field">
            <label for="reservation_time">Time</label>
            <select id="reservation_time" required>
              <option value="">Select a date first</option>
            </select>
            <span class="error-text">Please select a time.</span>
          </div>

          <div class="field">
            <label for="customer_name">Full name</label>
            <input type="text" id="customer_name" required />
          </div>
          <div class="grid grid-2">
            <div class="field">
              <label for="customer_phone">Phone number</label>
              <input type="tel" id="customer_phone" required />
            </div>
            <div class="field">
              <label for="customer_email">Email</label>
              <input type="email" id="customer_email" required />
            </div>
          </div>
          <div class="field">
            <label for="special_request">Special request (optional)</label>
            <textarea id="special_request" maxlength="500" placeholder="Birthday setup, window seat…"></textarea>
          </div>

          <button type="submit" class="btn btn-primary btn-block btn-lg" id="reservation-submit">Reserve Table</button>
        </form>
      </div>
    </section>

    <section class="section" style="background:var(--surface-alt);">
      <div class="container" style="max-width:640px;">
        <h2>My Reservations</h2>
        <div id="my-reservations" style="margin-top:var(--space-5);"></div>
      </div>
    </section>
  </main>
  <div id="app-footer"></div>

  <script src="js/config.js"></script>
  <script src="js/brand.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/render.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/pages/reservations.js"></script>
</body>

</html>
