<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Set New Password — Aroma FoodLand</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <style>.auth-shell { max-width: 420px; margin: var(--space-10) auto; }</style>
</head>
<body>
  <div id="app-header"></div>
  <main id="main">
    <section class="section">
      <div class="container auth-shell" id="reset-shell">
        <h1 class="text-center">Set a new password</h1>
        <form id="reset-form" novalidate style="margin-top:var(--space-6);">
          <div class="field">
            <label for="new_password">New password</label>
            <input type="password" id="new_password" required />
            <span class="hint">At least 8 characters, with an uppercase letter, lowercase letter and a number.</span>
            <span class="error-text">Password doesn't meet the requirements.</span>
          </div>
          <button type="submit" class="btn btn-primary btn-block btn-lg" id="reset-submit">Update Password</button>
        </form>
      </div>
    </section>
  </main>
  <div id="app-footer"></div>

  <script src="js/config.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/render.js"></script>
  <script src="js/layout.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const hashParams = new URLSearchParams(window.location.hash.replace(/^#/, ''));
      const accessToken = hashParams.get('access_token');
      const shell = document.getElementById('reset-shell');

      if (!accessToken) {
        shell.innerHTML = `<h1 class="text-center">This link is invalid or expired</h1><p class="text-center lede" style="margin:12px auto;">Please request a new password reset link.</p><a href="forgot-password.html" class="btn btn-primary" style="display:block;width:fit-content;margin:16px auto;">Request new link</a>`;
        return;
      }

      const PASSWORD_RE = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d).{8,}$/;
      const form = document.getElementById('reset-form');
      const btn = document.getElementById('reset-submit');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const pwd = document.getElementById('new_password').value;
        const field = document.getElementById('new_password').closest('.field');
        field.classList.toggle('has-error', !PASSWORD_RE.test(pwd));
        if (!PASSWORD_RE.test(pwd)) return;

        const run = window.AromaUI.withButtonLoading(btn, async () => {
          try {
            await window.AromaApi.post('/auth/reset-password', { access_token: accessToken, new_password: pwd });
            shell.innerHTML = `<div class="text-center"><h1>Password updated</h1><p class="lede" style="margin:12px auto;">You can now sign in with your new password.</p><a href="login.html" class="btn btn-primary" style="margin-top:16px;">Sign in</a></div>`;
          } catch (err) {
            window.AromaUI.toast(window.AromaUI.friendlyError(err), 'error');
          }
        });
        run();
      });
    });
  </script>
</body>
</html>
